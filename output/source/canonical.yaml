meta:
    engine: 4.2.1
    name: travis-ergogen-2026
    version: 2026.02.12
    date: '2026-02-12'
    author: Travis Hardiman
    url: 'https://github.com/dieseltravis/travis-ergogen-2026'
    tags:
        - ergogen
        - keyboard
        - cherrymx
        - hotswap
        - rp2040
        - wheel
        - oled
    cool_font: 3270 Nerd Font
units:
    kp: U + 2
    kspr: U + 1
    bp: kp/2 + 4
    sp: 1
    st: 1
    stabilizer_width: 7
    stabilizer_height: 16
    stabilizer_offset: 0
    stabilizer_spacing_3u: U * ((3 - 1) / 2)
    stabilizer_spacing_2u: 23.86 / 2
    board: 1.6
    height: 4
    wall: 2
    screwSize: 1.5
    standoffSize: 2.85
points:
    zones:
        matrix:
            anchor:
                shift:
                    - 50
                    - -200
            key:
                padding: kp
                spread: kspr
                tags:
                    - key
            columns:
                col0:
                    key:
                        tags: col_even
                        splay: 3sp
                        stagger: 0st
                        column_net: col0
                    rows:
                        row0:
                            shift:
                                - 0.5kspr
                                - 0.0kp
                            width: 2U
                            rotate: 1
                            tags:
                                - row_even
                                - key
                                - 2u_stabs
                            key:
                                led_next: LED37
                                led_this: LED36
                        row1:
                            shift:
                                - '-0.5kspr'
                                - 0.0kp
                            rotate: -1
                            key:
                                led_next: LED36
                                led_this: LED35
                        row2:
                            key:
                                led_next: LED23
                                led_this: LED22
                        row3:
                            key:
                                led_next: LED22
                                led_this: LED21
                        row4:
                            key:
                                led_next: LED09
                                led_this: LED08
                        row5:
                            key:
                                led_next: LED08
                                led_this: LED07
                col1:
                    key:
                        tags: col_odd
                        splay: '-sp'
                        stagger: st
                        column_net: col1
                    rows:
                        row0:
                            skip: true
                        row1:
                            key:
                                led_next: LED35
                                led_this: LED34
                        row2:
                            key:
                                led_next: LED24
                                led_this: LED23
                        row3:
                            key:
                                led_next: LED21
                                led_this: LED20
                        row4:
                            key:
                                led_next: LED10
                                led_this: LED09
                        row5:
                            key:
                                led_next: LED07
                                led_this: LED06
                col2:
                    key:
                        tags: col_even
                        splay: '-sp'
                        stagger: st
                        column_net: col2
                    rows:
                        row0:
                            key:
                                led_next: LED38
                                led_this: LED37
                        row1:
                            key:
                                led_next: LED34
                                led_this: LED33
                        row2:
                            key:
                                led_next: LED25
                                led_this: LED24
                        row3:
                            key:
                                led_next: LED20
                                led_this: LED19
                        row4:
                            key:
                                led_next: LED11
                                led_this: LED10
                        row5:
                            key:
                                led_next: LED06
                                led_this: LED05
                col3:
                    key:
                        tags: col_odd
                        splay: '-sp'
                        stagger: st
                        column_net: col3
                    rows:
                        row0:
                            key:
                                led_next: LED39
                                led_this: LED38
                        row1:
                            key:
                                led_next: LED33
                                led_this: LED32
                        row2:
                            key:
                                led_next: LED26
                                led_this: LED25
                        row3:
                            key:
                                led_next: LED19
                                led_this: LED18
                        row4:
                            key:
                                led_next: LED12
                                led_this: LED11
                        row5:
                            key:
                                led_next: LED05
                                led_this: LED04
                col4:
                    key:
                        tags: col_even
                        splay: '-sp'
                        stagger: '-st'
                        column_net: col4
                    rows:
                        row0:
                            key:
                                led_next: LED40
                                led_this: LED39
                        row1:
                            key:
                                led_next: LED32
                                led_this: LED31
                        row2:
                            key:
                                led_next: LED27
                                led_this: LED26
                        row3:
                            key:
                                led_next: LED18
                                led_this: LED17
                        row4:
                            key:
                                led_next: LED13
                                led_this: LED12
                        row5:
                            key:
                                led_next: LED04
                                led_this: LED03
                col5:
                    key:
                        tags: col_odd
                        splay: '-sp'
                        stagger: '-st'
                        column_net: col5
                    rows:
                        row0:
                            skip: true
                        row1:
                            key:
                                led_next: LED31
                                led_this: LED30
                        row2:
                            key:
                                led_next: LED28
                                led_this: LED27
                        row3:
                            key:
                                led_next: LED17
                                led_this: LED16
                        row4:
                            key:
                                led_next: LED14
                                led_this: LED13
                        row5:
                            key:
                                led_next: LED03
                                led_this: LED02
                col6:
                    key:
                        tags: col_even
                        splay: '-sp'
                        stagger: '-st'
                        column_net: col6
                    rows:
                        row0:
                            shift:
                                - '-0.5kspr'
                                - 0.0kp
                            width: 2U
                            rotate: -1
                            tags:
                                - row_even
                                - key
                                - 2u_stabs
                            key:
                                led_next: ''
                                led_this: LED40
                        row1:
                            shift:
                                - 0.5kspr
                                - 0.0kp
                            rotate: 1
                            key:
                                led_next: LED30
                                led_this: LED29
                        row2:
                            key:
                                led_next: LED29
                                led_this: LED28
                        row3:
                            key:
                                led_next: LED16
                                led_this: LED15
                        row4:
                            key:
                                led_next: LED15
                                led_this: LED14
                        row5:
                            key:
                                led_next: LED02
                                led_this: LED01
            rows:
                row0:
                    tags:
                        - key
                        - row_even
                    row_net: row0
                row1:
                    tags:
                        - key
                        - row_odd
                    row_net: row1
                row2:
                    tags:
                        - key
                        - row_even
                    row_net: row2
                row3:
                    tags:
                        - key
                        - row_odd
                    row_net: row3
                row4:
                    tags:
                        - key
                        - row_even
                    row_net: row4
                row5:
                    tags:
                        - key
                        - row_odd
                    row_net: row5
outlines:
    raw:
        -
            what: rectangle
            where: true
            size:
                - kp + 2
                - kp + 2
    2u_stabilizer:
        -
            operation: stack
            where: 2u_stabs
            what: rectangle
            size:
                - stabilizer_width
                - stabilizer_height
            adjust:
                shift:
                    - stabilizer_spacing_2u
                    - stabilizer_offset
        -
            operation: stack
            where: 2u_stabs
            what: rectangle
            size:
                - stabilizer_width
                - stabilizer_height
            adjust:
                shift:
                    - '-stabilizer_spacing_2u'
                    - stabilizer_offset
    keys:
        -
            what: rectangle
            where: key
            size:
                - kp - 2
                - kp - 2
    board1:
        -
            what: polygon
            operation: stack
            fillet: 2.75
            points:
                -
                    ref: matrix_col0_row0
                    shift:
                        - '-bp - 0.5kspr - 8'
                        - '-kp/2'
                -
                    ref: matrix_col0_row0
                    shift:
                        - '-kp/2 - 5'
                        - '-bp - 10'
                -
                    ref: matrix_col3_row0
                    shift:
                        - '-bp/3'
                        - '-bp - 12'
                -
                    ref: matrix_col3_row0
                    shift:
                        - bp/3
                        - '-bp - 12'
                -
                    ref: matrix_col6_row0
                    shift:
                        - kp/2 + 5
                        - '-bp - 10'
                -
                    ref: matrix_col6_row0
                    shift:
                        - bp + 0.5kspr + 8
                        - '-kp/2'
                -
                    ref: matrix_col6_row1
                    shift:
                        - bp + 8
                        - '-bp / 2'
                -
                    ref: matrix_col6_row2
                    shift:
                        - bp
                        - '-bp / 2'
                -
                    ref: matrix_col6_row5
                    shift:
                        - bp
                        - bp + 20
                -
                    ref: matrix_col6_row5
                    shift:
                        - 0
                        - bp + 20
                -
                    ref: matrix_col5_row5
                    shift:
                        - 0
                        - bp + 20
                -
                    ref: matrix_col4_row5
                    shift:
                        - 0
                        - bp + 20
                -
                    ref: matrix_col3_row5
                    shift:
                        - 0
                        - bp + 20
                -
                    ref: matrix_col2_row5
                    shift:
                        - 0
                        - bp + 20
                -
                    ref: matrix_col1_row5
                    shift:
                        - 0
                        - bp + 20
                -
                    ref: matrix_col0_row5
                    shift:
                        - 0
                        - bp + 20
                -
                    ref: matrix_col0_row5
                    shift:
                        - '-bp'
                        - bp + 20
                -
                    ref: matrix_col0_row2
                    shift:
                        - '-bp'
                        - '-bp / 2'
                -
                    ref: matrix_col0_row1
                    shift:
                        - '-bp - 8'
                        - '-bp / 2'
    xlboard1:
        -
            what: polygon
            operation: stack
            fillet: 2.75
            points:
                -
                    ref: matrix_col0_row0
                    shift:
                        - '-bp - 0.5kspr - 8 - wall'
                        - '-bp - 10 - wall'
                -
                    ref: matrix_col3_row0
                    shift:
                        - '-bp/3 - wall'
                        - '-bp - 12 - wall'
                -
                    ref: matrix_col3_row0
                    shift:
                        - bp/3 + wall
                        - '-bp - 12 - wall'
                -
                    ref: matrix_col6_row0
                    shift:
                        - bp + 0.5kspr + 8 + wall
                        - '-bp - 10 - wall'
                -
                    ref: matrix_col6_row1
                    shift:
                        - bp + 8 + wall
                        - '-bp / 2'
                -
                    ref: matrix_col6_row2
                    shift:
                        - bp + wall
                        - '-bp / 2'
                -
                    ref: matrix_col6_row5
                    shift:
                        - bp + wall
                        - bp + 20 + wall
                -
                    ref: matrix_col6_row5
                    shift:
                        - 0
                        - bp + 20 + wall
                -
                    ref: matrix_col5_row5
                    shift:
                        - 0
                        - bp + 20 + wall
                -
                    ref: matrix_col4_row5
                    shift:
                        - 0
                        - bp + 20 + wall
                -
                    ref: matrix_col3_row5
                    shift:
                        - 0
                        - bp + 20 + wall
                -
                    ref: matrix_col2_row5
                    shift:
                        - 0
                        - bp + 20 + wall
                -
                    ref: matrix_col1_row5
                    shift:
                        - 0
                        - bp + 20 + wall
                -
                    ref: matrix_col0_row5
                    shift:
                        - 0
                        - bp + 20 + wall
                -
                    ref: matrix_col0_row5
                    shift:
                        - '-bp - wall'
                        - bp + 20 + wall
                -
                    ref: matrix_col0_row2
                    shift:
                        - '-bp - wall'
                        - '-bp / 2'
                -
                    ref: matrix_col0_row1
                    shift:
                        - '-bp - 8 - wall'
                        - '-bp / 2'
    board:
        -
            what: path
            segments:
                -
                    type: arc
                    points:
                        -
                            ref: matrix_col0_row5
                            shift:
                                - 0
                                - bp + 20
                        -
                            ref: matrix_col3_row5
                            shift:
                                - 0
                                - bp + 20
                        -
                            ref: matrix_col6_row5
                            shift:
                                - 0
                                - bp + 20
                -
                    type: line
                    points:
                        -
                            ref: matrix_col6_row5
                            shift:
                                - bp
                                - bp + 20
                        -
                            ref: matrix_col6_row2
                            shift:
                                - bp
                                - '-bp / 2'
                        -
                            ref: matrix_col6_row1
                            shift:
                                - bp + 8
                                - '-bp / 2'
                        -
                            ref: matrix_col6_row0
                            shift:
                                - bp + 0.5kspr + 8
                                - '-kp/2'
                        -
                            ref: matrix_col6_row0
                            shift:
                                - kp/2 + 5
                                - '-bp - 10'
                -
                    type: arc
                    points:
                        -
                            ref: matrix_col3_row0
                            shift:
                                - 0
                                - '-bp - 12'
                        -
                            ref: matrix_col0_row0
                            shift:
                                - '-kp/2 - 5'
                                - '-bp - 10'
                -
                    type: line
                    points:
                        -
                            ref: matrix_col0_row0
                            shift:
                                - '-bp - 0.5kspr - 8'
                                - '-kp/2'
                        -
                            ref: matrix_col0_row1
                            shift:
                                - '-bp - 8'
                                - '-bp / 2'
                        -
                            ref: matrix_col0_row2
                            shift:
                                - '-bp'
                                - '-bp / 2'
                        -
                            ref: matrix_col0_row5
                            shift:
                                - '-bp'
                                - bp + 20
    xlboard:
        -
            what: path
            segments:
                -
                    type: arc
                    points:
                        -
                            ref: matrix_col0_row5
                            shift:
                                - 0
                                - bp + 20 + wall
                        -
                            ref: matrix_col3_row5
                            shift:
                                - 0
                                - bp + 20 + wall
                        -
                            ref: matrix_col6_row5
                            shift:
                                - 0
                                - bp + 20 + wall
                -
                    type: line
                    points:
                        -
                            ref: matrix_col6_row5
                            shift:
                                - bp + wall
                                - bp + 20 + wall
                        -
                            ref: matrix_col6_row2
                            shift:
                                - bp + wall
                                - '-bp / 2'
                        -
                            ref: matrix_col6_row1
                            shift:
                                - bp + 8 + wall
                                - '-bp / 2'
                        -
                            ref: matrix_col6_row0
                            shift:
                                - bp + 0.5kspr + 8 + wall
                                - '-kp/2'
                        -
                            ref: matrix_col6_row0
                            shift:
                                - kp/2 + 5 + wall
                                - '-bp - 10 - wall'
                -
                    type: arc
                    points:
                        -
                            ref: matrix_col3_row0
                            shift:
                                - 0
                                - '-bp - 12 - wall'
                        -
                            ref: matrix_col0_row0
                            shift:
                                - '-kp/2 - 5 - wall'
                                - '-bp - 10 - wall'
                -
                    type: line
                    points:
                        -
                            ref: matrix_col0_row0
                            shift:
                                - '-bp - 0.5kspr - 8 - wall'
                                - '-kp/2'
                        -
                            ref: matrix_col0_row1
                            shift:
                                - '-bp - 8 - wall'
                                - '-bp / 2'
                        -
                            ref: matrix_col0_row2
                            shift:
                                - '-bp - wall'
                                - '-bp / 2'
                        -
                            ref: matrix_col0_row5
                            shift:
                                - '-bp - wall'
                                - bp + 20 + wall
    combo:
        -
            name: board
        -
            operation: subtract
            name: keys
    mounting:
        -
            what: circle
            radius: screwSize
            where:
                ref: matrix_col0_row5
                shift:
                    - '-bp + 2.75'
                    - bp + 20 - 2.75
        -
            what: circle
            radius: screwSize
            where:
                ref: matrix_col3_row5
                shift:
                    - 0
                    - bp + 10.5
        -
            what: circle
            radius: screwSize
            where:
                ref: matrix_col6_row5
                shift:
                    - bp - 3
                    - bp + 20 - 2.75 - 10.25
        -
            what: circle
            radius: screwSize
            where:
                ref: matrix_col6_row0
                shift:
                    - bp + 0.5kspr - 2.75 + 1
                    - '-bp + 2.75 - 3'
        -
            what: circle
            radius: screwSize
            where:
                ref: matrix_col3_row0
                shift:
                    - 0
                    - '-5bp / 4'
        -
            what: circle
            radius: screwSize
            where:
                ref: matrix_col0_row0
                shift:
                    - '-bp - 0.5kspr + 2.75 - 1'
                    - '-bp + 2.75 - 3'
    standoff:
        -
            what: circle
            radius: standoffSize
            where:
                ref: matrix_col0_row5
                shift:
                    - '-bp + 2.75'
                    - bp + 20 - 2.75
        -
            what: circle
            radius: standoffSize
            where:
                ref: matrix_col3_row5
                shift:
                    - 0
                    - bp + 10.5
        -
            what: rectangle
            size:
                - 1
                - 12
            where:
                ref: matrix_col3_row5
                shift:
                    - 0
                    - bp + 10.5 + 5
        -
            what: circle
            radius: standoffSize
            where:
                ref: matrix_col6_row5
                shift:
                    - bp - 3
                    - bp + 20 - 2.75 - 10.25
        -
            what: rectangle
            size:
                - 4
                - standoffSize * 2
            where:
                ref: matrix_col6_row5
                shift:
                    - bp - 1
                    - bp + 20 - 2.75 - 10.25
        -
            what: circle
            radius: standoffSize
            where:
                ref: matrix_col6_row0
                shift:
                    - bp + 0.5kspr - 2.75 + 1
                    - '-bp + 2.75 - 3'
        -
            what: circle
            radius: standoffSize
            where:
                ref: matrix_col3_row0
                shift:
                    - 0
                    - '-5bp / 4'
        -
            what: rectangle
            size:
                - standoffSize * 2
                - 10
            where:
                ref: matrix_col3_row0
                shift:
                    - 0
                    - '-5bp / 4 - 5'
        -
            what: circle
            radius: standoffSize
            where:
                ref: matrix_col0_row0
                shift:
                    - '-bp - 0.5kspr + 2.75 - 1'
                    - '-bp + 2.75 - 3'
    plate:
        -
            what: rectangle
            where: key
            size:
                - 13.95
                - 13.95
pcbs:
    travis_erg2026:
        template: kicad8
        outlines:
            main:
                outline: board
        footprints:
            mcu:
                what: travis/ScottoKeebs-RP2040_Pro_Micro
                where:
                    ref: matrix_col6_row5
                    shift:
                        - -3.5
                        - kp + 0.5
                    rotate: -90
                params:
                    value: RP2040 Community Edition
                    P2: TX
                    P3: RX
                    P4: GND
                    P5: GND
                    P6: sda
                    P7: scl
                    P8: encB
                    P9: encA
                    P13: row0
                    P14: row1
                    P15: row2
                    P16: row3
                    P17: row4
                    P18: row5
                    P31: LED01
                    P29: GND
                    P25: col7
                    P24: col6
                    P23: col4
                    P22: col3
                    P21: col2
                    P20: col1
                    P19: col0
                    offset3d:
                        - 0
                        - 0
                        - 7
            cap1:
                what: travis/CRadialD63H11P25
                where:
                    ref: matrix_col6_row5
                    shift:
                        - 2.5
                        - kp - 0.75
                    rotate: 90
                params:
                    P1: VCC
                    P2: GND
                    side: F
                    bend: 90
                    offset3d:
                        - 0
                        - 0
                        - 0.12
                    value: 6.3V 1000uF
            cap_vcc_route:
                what: ceoloide/utility_router
                where:
                    ref: matrix_col6_row5
                    shift:
                        - 2.5
                        - kp - 0.75
                params:
                    width: 1.666
                    net: VCC
                    route: 'f(0.0, 0.0)(0.35, 6.35)'
            trrs_txrx:
                what: ceoloide/trrs_pj320a
                where:
                    ref: matrix_col5_row5
                    shift:
                        - '-kp/2 + 4.5 - 3.75'
                        - 3kp/2 + 4
                    rotate: -2.5
                params:
                    TP: VCC
                    R1: TX
                    R2: RX
                    SL: GND
            trrs_rxtx:
                what: ceoloide/trrs_pj320a
                where:
                    ref: matrix_col5_row5
                    shift:
                        - '-kp/2 + 4.5 + 3.1'
                        - 3kp/2 + 3.7
                    rotate: -2.5
                params:
                    TP: VCC
                    R1: RX
                    R2: TX
                    SL: GND
            oled1:
                what: travis/Keebio-I2C_Breakout
                params:
                    P3: scl
                    P4: sda
                where:
                    ref: matrix_col0_row5
                    shift:
                        - '-kp / 2 - 1'
                        - kp + 5.5
                    rotate: 0
            oled2:
                what: travis/Keebio-I2C_Breakout
                params:
                    P3: scl
                    P4: sda
                where:
                    ref: matrix_col1_row5
                    shift:
                        - '-2.54 - 1.27'
                        - kp / 2 + 1.5
                    rotate: 90
            oled3:
                what: travis/Keebio-I2C_Breakout
                params:
                    P3: scl
                    P4: sda
                    justify_override: left
                where:
                    ref: matrix_col1_row5
                    shift:
                        - 2.54 + 1.27
                        - kp + 11
                    rotate: 273
            oled4:
                what: travis/Keebio-I2C_Breakout
                params:
                    P3: scl
                    P4: sda
                where:
                    ref: matrix_col3_row5
                    shift:
                        - '-2.54 - 1.27'
                        - kp / 2 + 1.5
                    rotate: 90
            oled5:
                what: travis/Keebio-I2C_Breakout
                params:
                    P3: scl
                    P4: sda
                where:
                    ref: matrix_col3_row5
                    shift:
                        - 2.54 + 1.27
                        - kp + 11
                    rotate: 270
            enc_a_resistor:
                what: travis/RAxialL6D25P10H
                where:
                    ref: matrix_col6_row5
                    shift:
                        - -7.5
                        - kp - 4.2
                    rotate: 90
                params:
                    side: B
                    from: VCC
                    to: encA
                    value: 510k
            enc_b_resistor:
                what: travis/RAxialL6D25P10H
                where:
                    ref: matrix_col6_row5
                    shift:
                        - -4.5
                        - kp - 4.2
                    rotate: 90
                params:
                    side: B
                    from: VCC
                    to: encB
                    value: 510k
            wheel1:
                what: travis/Alps-EC10E1220501
                params:
                    P1: encA
                    P2: encB
                    P3: GND
                    P4: GND
                where:
                    ref: matrix_col0_row0
                    shift:
                        - '-3kp / 2 + 1.75'
                        - 0
                    rotate: -90
            wheel2:
                what: travis/Alps-EC10E1220501
                params:
                    P1: encA
                    P2: encB
                    P3: GND
