meta:
  engine: 4.2.1
  name: &name "travis-ergogen-2026"
  version: &meta_version "2026.02.12"
  date: "2026-02-12"
  author: 'Travis Hardiman'
  url: &url https://github.com/dieseltravis/travis-ergogen-2026
  tags: [ "ergogen", "keyboard", "cherrymx", "hotswap", "rp2040", "wheel", "oled" ]
  cool_font: &cool_font "3270 Nerd Font"
units:
  kp: U + 2
  kspr: U + 1
  bp: kp/2 + 4
  sp: 1
  st: 1
  # stabs
  stabilizer_width: 7
  stabilizer_height: 16
  stabilizer_offset: 0 # This means south stabs, use `orient` to rotate them for north facing scenarios
  stabilizer_spacing_3u: U * ((3 - 1) / 2)
  stabilizer_spacing_2u: 23.86 / 2 # 0.94in / 2
  # case
  board: 1.6
  height: 4.0
  wall: 2.0
  # Defaults to M2 Screws
  #screwSize: 1
  # M2 Screw Inserts
  screwSize: 1.5
  standoffSize: 2.85
points:
  zones:
    matrix:
      anchor:
        # move the PCB into view for KiCad
        shift: [50, -200]
      key:
        padding: kp
        spread: kspr
        #splay: 0
        tags:
          - key
      columns:
        col0:
          key:
            tags: col_even
            splay: 3sp
            stagger: 0st
            column_net: col0
          rows:
            row0:
              shift: [0.5kspr, 0.0kp]
              width: 2U
              rotate: 1
              tags:
                - row_even
                - key
                - 2u_stabs
              key:
                led_next: LED37
                led_this: LED36
            row1:
              shift: [-0.5kspr, 0.0kp]
              rotate: -1
              key:
                led_next: LED36
                led_this: LED35
            row2:
              key:
                led_next: LED23
                led_this: LED22
            row3:
              key:
                led_next: LED22
                led_this: LED21
            row4:
              key:
                led_next: LED09
                led_this: LED08
            row5:
              key:
                led_next: LED08
                led_this: LED07
        col1:
          key:
            tags: col_odd
            splay: -sp
            stagger: st
            column_net: col1
          rows:
            row0:
              skip: true
              #key:
              #  led_next: LED38
              #  led_this: LED37
            row1:
              key:
                led_next: LED35
                led_this: LED34
            row2:
              key:
                led_next: LED24
                led_this: LED23
            row3:
              key:
                led_next: LED21
                led_this: LED20
            row4:
              key:
                led_next: LED10
                led_this: LED09
            row5:
              key:
                led_next: LED07
                led_this: LED06
        col2:
          key:
            tags: col_even
            splay: -sp
            stagger: st
            column_net: col2
          rows:
            row0:
              key:
                #led_next: LED39
                #led_this: LED38
                led_next: LED38
                led_this: LED37
            row1:
              key:
                led_next: LED34
                led_this: LED33
            row2:
              key:
                led_next: LED25
                led_this: LED24
            row3:
              key:
                led_next: LED20
                led_this: LED19
            row4:
              key:
                led_next: LED11
                led_this: LED10
            row5:
              key:
                led_next: LED06
                led_this: LED05
        col3:
          key:
            tags: col_odd
            splay: -sp
            stagger: st
            column_net: col3
          rows:
            row0:
              key:
                #led_next: LED40
                #led_this: LED39
                led_next: LED39
                led_this: LED38
            row1:
              key:
                led_next: LED33
                led_this: LED32
            row2:
              key:
                led_next: LED26
                led_this: LED25
            row3:
              key:
                led_next: LED19
                led_this: LED18
            row4:
              key:
                led_next: LED12
                led_this: LED11
            row5:
              key:
                led_next: LED05
                led_this: LED04
        col4:
          key:
            tags: col_even
            splay: -sp
            stagger: -st
            column_net: col4
          rows:
            row0:
              key:
                #led_next: LED41
                #led_this: LED40
                led_next: LED40
                led_this: LED39
            row1:
              key:
                led_next: LED32
                led_this: LED31
            row2:
              key:
                led_next: LED27
                led_this: LED26
            row3:
              key:
                led_next: LED18
                led_this: LED17
            row4:
              key:
                led_next: LED13
                led_this: LED12
            row5:
              key:
                led_next: LED04
                led_this: LED03
        col5:
          key:
            tags: col_odd
            splay: -sp
            stagger: -st
            column_net: col5
          rows:
            row0:
              skip: true
              #key:
              #  led_next: LED42
              #  led_this: LED41
            row1:
              key:
                led_next: LED31
                led_this: LED30
            row2:
              key:
                led_next: LED28
                led_this: LED27
            row3:
              key:
                led_next: LED17
                led_this: LED16
            row4:
              key:
                led_next: LED14
                led_this: LED13
            row5:
              key:
                led_next: LED03
                led_this: LED02
        col6:
          key:
            tags: col_even
            splay: -sp
            stagger: -st
            column_net: col6
          rows:
            row0:
              shift: [-0.5kspr, 0.0kp]
              width: 2U
              rotate: -1
              tags:
                - row_even
                - key
                - 2u_stabs
              key:
                led_next: ""
                #led_this: LED42
                led_this: LED40
            row1:
              shift: [0.5kspr, 0.0kp]
              rotate: 1
              key:
                led_next: LED30
                led_this: LED29
            row2:
              key:
                led_next: LED29
                led_this: LED28
            row3:
              key:
                led_next: LED16
                led_this: LED15
            row4:
              key:
                led_next: LED15
                led_this: LED14
            row5:
              key:
                led_next: LED02
                led_this: LED01
      rows:
        row0:
          tags:
            - key
            - row_even
          row_net: row0
        row1:
          tags:
            - key
            - row_odd
          row_net: row1
        row2:
          tags:
            - key
            - row_even
          row_net: row2
        row3:
          tags:
            - key
            - row_odd
          row_net: row3
        row4:
          tags:
            - key
            - row_even
          row_net: row4
        row5:
          tags:
            - key
            - row_odd
          row_net: row5
outlines:
  raw:
    - what: rectangle
      where: true
      size: [kp + 2, kp + 2]
  2u_stabilizer:
  # This creates the stabilizer, you just need to use its name in a `where` clause of another outline
    - operation: stack
      where: 2u_stabs # Set this tag on the keys you want
      what: rectangle
      size: [stabilizer_width, stabilizer_height]
      adjust:
        shift: [stabilizer_spacing_2u, stabilizer_offset]
    - operation: stack
      where: 2u_stabs
      what: rectangle
      size: [stabilizer_width, stabilizer_height]
      adjust:
        shift: [-stabilizer_spacing_2u, stabilizer_offset]
  keys:
    - what: rectangle
      where: key
      size: [kp - 2, kp - 2]
  board1:
    - what: polygon
      operation: stack
      fillet: 2.75
      points:
        # bottom
        - ref: matrix_col0_row0
          shift: [-bp - 0.5kspr - 8, -kp/2]
        #- ref: matrix_col0_row0
        #  shift: [-bp - 0.5kspr - 3, -bp - 5]
        - ref: matrix_col0_row0
          shift: [-kp/2 - 5, -bp - 10]
        - ref: matrix_col3_row0
          shift: [-bp/3, -bp - 12]
        - ref: matrix_col3_row0
          shift: [bp/3, -bp - 12]
        - ref: matrix_col6_row0
          shift: [kp/2 + 5, -bp - 10]
        #- ref: matrix_col6_row0
        #  shift: [bp + 0.5kspr + 3, -bp - 5]
        - ref: matrix_col6_row0
          shift: [bp + 0.5kspr + 8, -kp/2]
        # right
        - ref: matrix_col6_row1
          shift: [bp + 8 , -bp / 2]
        - ref: matrix_col6_row2
          shift: [bp , -bp / 2]
        # top
        - ref: matrix_col6_row5
          shift: [bp, bp + 20]
        #- ref: matrix_col3_row5
        #  shift: [bp/3, bp + 20]
        - ref: matrix_col6_row5
          shift: [0, bp + 20]
        - ref: matrix_col5_row5
          shift: [0, bp + 20]
        - ref: matrix_col4_row5
          shift: [0, bp + 20]
        - ref: matrix_col3_row5
          shift: [0, bp + 20]
        - ref: matrix_col2_row5
          shift: [0, bp + 20]
        - ref: matrix_col1_row5
          shift: [0, bp + 20]
        - ref: matrix_col0_row5
          shift: [0, bp + 20]
        #- ref: matrix_col3_row5
        #  shift: [-bp/3, bp + 20]
        - ref: matrix_col0_row5
          shift: [-bp, bp + 20]
        # left
        - ref: matrix_col0_row2
          shift: [-bp, -bp / 2]
        - ref: matrix_col0_row1
          shift: [-bp - 8, -bp / 2]
  xlboard1:
    - what: polygon
      operation: stack
      fillet: 2.75
      points:
        # bottom
        - ref: matrix_col0_row0
          shift: [-bp - 0.5kspr - 8 - wall, -bp - 10 - wall]
        - ref: matrix_col3_row0
          shift: [-bp/3 - wall, -bp - 12 - wall]
        - ref: matrix_col3_row0
          shift: [bp/3 + wall, -bp - 12 - wall]
        - ref: matrix_col6_row0
          shift: [bp + 0.5kspr + 8 + wall, -bp - 10 - wall]
        # right
        - ref: matrix_col6_row1
          shift: [bp + 8 + wall, -bp / 2]
        - ref: matrix_col6_row2
          shift: [bp + wall, -bp / 2 ]
        # top
        - ref: matrix_col6_row5
          shift: [bp + wall, bp + 20 + wall]
        #- ref: matrix_col3_row5
        #  shift: [bp/3, bp + 20]
        - ref: matrix_col6_row5
          shift: [0, bp + 20 + wall]
        - ref: matrix_col5_row5
          shift: [0, bp + 20 + wall]
        - ref: matrix_col4_row5
          shift: [0, bp + 20 + wall]
        - ref: matrix_col3_row5
          shift: [0, bp + 20 + wall]
        - ref: matrix_col2_row5
          shift: [0, bp + 20 + wall]
        - ref: matrix_col1_row5
          shift: [0, bp + 20 + wall]
        - ref: matrix_col0_row5
          shift: [0, bp + 20 + wall]
        #- ref: matrix_col3_row5
        #  shift: [-bp/3, bp + 20]
        - ref: matrix_col0_row5
          shift: [-bp - wall, bp + 20 + wall]
        # left
        - ref: matrix_col0_row2
          shift: [-bp - wall, -bp / 2]
        - ref: matrix_col0_row1
          shift: [-bp - 8 - wall, -bp / 2]
  board:
    - what: path
      segments:
      - type: arc
        points:
        - ref: matrix_col0_row5
          shift: [0, bp + 20]
        - ref: matrix_col3_row5
          shift: [0, bp + 20]
        - ref: matrix_col6_row5
          shift: [5, bp + 20]
      - type: arc
        points:
        - ref: matrix_col6_row5
          shift: [bp, bp + 15]
        - ref: matrix_col6_row5
          shift: [bp, bp + 10]
      - type: line
        points:
        - ref: matrix_col6_row5
          shift: [bp, bp]
        - ref: matrix_col6_row2
          shift: [bp , -bp / 2]
        - ref: matrix_col6_row1
          shift: [bp + 8 , -bp / 2]
        - ref: matrix_col6_row0
          shift: [bp + 0.5kspr + 8, -kp/2]
        - ref: matrix_col6_row0
          shift: [kp/2 + 5, -bp - 10]
      - type: arc
        points:
        #- ref: matrix_col3_row0
        #  shift: [bp/3, -bp - 12]
        - ref: matrix_col3_row0
          shift: [0, -bp - 12]
        #- ref: matrix_col3_row0
        #  shift: [-bp/3, -bp - 12]
        - ref: matrix_col0_row0
          shift: [-kp/2 - 5, -bp - 10]
      - type: line
        points:
        - ref: matrix_col0_row0
          shift: [-bp - 0.5kspr - 8, -kp/2]
        - ref: matrix_col0_row1
          shift: [-bp - 8, -bp / 2]
        - ref: matrix_col0_row2
          shift: [-bp, -bp / 2]
        - ref: matrix_col0_row5
          shift: [-bp, bp + 20]
  xlboard:
    - what: path
      segments:
      - type: arc
        points:
        - ref: matrix_col0_row5
          shift: [0, bp + 20 + wall]
        - ref: matrix_col3_row5
          shift: [0, bp + 20 + wall]
        - ref: matrix_col6_row5
          shift: [0, bp + 20 + wall]
      - type: arc
        points:
        - ref: matrix_col6_row5
          shift: [bp + wall, bp + 5 + wall]
        - ref: matrix_col6_row5
          shift: [bp + wall, bp + 0 + wall]
      - type: line
        points:
        - ref: matrix_col6_row5
          shift: [bp + wall, 0]
        - ref: matrix_col6_row2
          shift: [bp + wall , -bp / 2]
        - ref: matrix_col6_row1
          shift: [bp + 8 + wall , -bp / 2]
        - ref: matrix_col6_row0
          shift: [bp + 0.5kspr + 8 + wall, -kp/2]
        - ref: matrix_col6_row0
          shift: [kp/2 + 5, -bp - 10 - wall]
      - type: arc
        points:
        #- ref: matrix_col3_row0
        #  shift: [bp/3, -bp - 12]
        - ref: matrix_col3_row0
          shift: [0, -bp - 12 - wall]
        #- ref: matrix_col3_row0
        #  shift: [-bp/3, -bp - 12]
        - ref: matrix_col0_row0
          shift: [-kp/2 - 5, -bp - 10 - wall]
      - type: line
        points:
        - ref: matrix_col0_row0
          shift: [-bp - 0.5kspr - 8 - wall, -kp/2]
        - ref: matrix_col0_row1
          shift: [-bp - 8 - wall, -bp / 2]
        - ref: matrix_col0_row2
          shift: [-bp - wall, -bp / 2]
        - ref: matrix_col0_row5
          shift: [-bp - wall, bp + 20 + wall]
  combo:
    - name: board
    - operation: subtract
      name: keys
  mounting:
    - what: circle
      radius: screwSize
      where: &holeTopLeft
        ref: matrix_col0_row5
        shift: [-bp + 2.75, bp + 20 - 2.75]
    - what: circle
      radius: screwSize
      where: &holeTopCenter
        ref: matrix_col3_row5
        shift: [0, bp + 10.5]
    - what: circle
      radius: screwSize
      where: &holeTopRight
        ref: matrix_col6_row5
        shift: [bp - 3, bp + 20 - 2.75 - 10.25]
    - what: circle
      radius: screwSize
      where: &holeBottomRight
        ref: matrix_col6_row0
        shift: [bp + 0.5kspr - 2.75 + 1, -bp + 2.75 - 3]
    - what: circle
      radius: screwSize
      where: &holeBottomCenter
        ref: matrix_col3_row0
        shift: [0, -5bp / 4]
    - what: circle
      radius: screwSize
      where: &holeBottomLeft
        ref: matrix_col0_row0
        shift: [-bp - 0.5kspr + 2.75 - 1, -bp + 2.75 - 3]
  standoff:
    - what: circle
      radius: standoffSize
      where:
        <<: *holeTopLeft
    - what: circle
      radius: standoffSize
      where:
        <<: *holeTopCenter
    - what: rectangle
      size: [1, 12]
      where:
        ref: matrix_col3_row5
        shift: [0, bp + 10.5 + 5]
    - what: circle
      radius: standoffSize
      where:
        <<: *holeTopRight
    - what: rectangle
      size: [4, standoffSize * 2]
      where:
        ref: matrix_col6_row5
        shift: [bp - 1, bp + 20 - 2.75 - 10.25]
    - what: circle
      radius: standoffSize
      where:
        <<: *holeBottomRight
    - what: circle
      radius: standoffSize
      where:
        <<: *holeBottomCenter
    - what: rectangle
      size: [standoffSize * 2, 10]
      where:
        ref: matrix_col3_row0
        shift: [0, -5bp / 4 - 5]
    - what: circle
      radius: standoffSize
      where:
        <<: *holeBottomLeft
  plate:
    - what: rectangle
      where: key
      size: [ 13.95, 13.95 ]

pcbs:
  travis_erg2026:
    template: kicad8
    outlines:
      main:
        outline: board
    footprints:

      mcu:
        what: travis/ScottoKeebs-RP2040_Pro_Micro
        where:
          ref: matrix_col6_row5
          shift: [-3.5, kp + 0.5]
          rotate: -90
        params:
          value: "RP2040 Community Edition"
          # left
          #P1:       # GP10
          P2: TX     # GP0  D3 TX0/PD3
          P3: RX     # GP1  D2 RX0/PD2
          P4: GND
          P5: GND
          P6: sda    # D1 SDA
          P7: scl    # D0 SCL PWM
          P8: encB   # D4 A6
          P9: encA   # C6 PWM
          #P10:      # D7 A7 PWM
          #P11:      # E6
          #P12:      # B4 A8
          P13: row0  # B5 A9 PWM
          # bottom
          P14: row1
          P15: row2
          P16: row3
          P17: row4
          P18: row5
          # right (from top)
          P31: LED01 # GP11
          #P30:      # RAW 5V
          P29: GND
          #P28:      # RESET 13
          #P27:      # VCC 3.3V
          #P26:      # F4 A3
          P25: col7  # F5 A2
          P24: col6  # F6 A1
          P23: col4  # F7 A0
          P22: col3  # B1 SCLK
          P21: col2  # B3 MISO
          P20: col1  # B2 MOSI
          P19: col0  # B6 A10 PWM
          offset3d: [0, 0, 7]

      cap1:
        what: travis/CRadialD63H11P25
        where:
          ref: matrix_col6_row5
          shift: [2.5, kp - 0.75]
          rotate: 90
        params:
          P1: VCC
          P2: GND
          side: F
          bend: 90
          # TODO: why is the Z offset so weird? is the 3d model in cm?
          offset3d: [0, 0, 0.12]
          value: "6.3V 1000uF"
      cap_vcc_route:
        what: ceoloide/utility_router
        where:
          ref: matrix_col6_row5
          shift: [2.5, kp - 0.75]
        params:
          width: 1.666
          net: "VCC"
          route: "f(0.0, 0.0)(0.35, 6.35)"

      trrs_txrx: &trrs
        what: ceoloide/trrs_pj320a
        where:
          ref: matrix_col5_row5
          shift: [-kp/2 + 4.5 - 3.75, 3kp/2 + 4]
          rotate: -2.5
        params:
          TP: "VCC"
          R1: "TX"
          R2: "RX"
          SL: "GND"
      trrs_rxtx:
        <<: *trrs
        where.shift: [-kp/2 + 4.5 + 3.1, 3kp/2 + 3.7]
        params.R1: "RX"
        params.R2: "TX"

      # oled mounting options
      oled1: &oled
        what: travis/Keebio-I2C_Breakout
        params:
          #side: "F"
          P3: scl
          P4: sda
        where:
          ref: matrix_col0_row5
          shift: [-kp / 2 - 1, kp + 5.5]
          rotate: 0
      oled2:
        <<: *oled
        where:
          ref: matrix_col1_row5
          shift: [-2.54 - 1.27, kp / 2 + 1.5]
          rotate: 90
      oled3:
        <<: *oled
        params.justify_override: left
        where:
          ref: matrix_col1_row5
          shift: [2.54 + 1.27, kp + 11]
          rotate: 273
      oled4:
        <<: *oled
        where:
          ref: matrix_col3_row5
          shift: [-2.54 - 1.27, kp / 2 + 1.5]
          rotate: 90
      oled5:
        <<: *oled
        where:
          ref: matrix_col3_row5
          shift: [2.54 + 1.27, kp + 11]
          rotate: 270

      # encoder wheel options
      enc_a_resistor: &encr
        what: travis/RAxialL6D25P10H
        where:
          ref: matrix_col6_row5
          shift: [-7.5, kp - 4.2]
          rotate: 90
        params:
          side: B
          from: VCC
          to: encA
          value: "510k"
      enc_b_resistor:
        <<: *encr
        where.shift: [-4.5, kp - 4.2]
        params.to: encB

      wheel1: &wheel
        what: travis/Alps-EC10E1220501
        params:
          P1: encA
          P2: encB
          P3: GND
          P4: GND
        where:
          ref: matrix_col0_row0
          shift: [-3kp / 2 + 1.75, 0]
          rotate: -90
      wheel2:
        <<: *wheel
        where:
          ref: matrix_col0_row0
          shift: [-kp / 2, -kp - 1]
          rotate: 0
      wheel3:
        <<: *wheel
        where:
          ref: matrix_col6_row0
          shift: [kp / 2, -kp - 1]
          rotate: 0
      wheel4:
        <<: *wheel
        where:
          ref: matrix_col6_row0
          shift: [3kp / 2 - 1.75, 0]
          rotate: 90

      # keys
      mx_hotswap_key:
        # what: ceoloide/switch_mx
        what: travis/switch_mx
        where: meta.tags ~ /key/
        params:
          include_corner_marks: true
          include_keycap: true
          from: "{{column_net}}"
          to: "{{name}}"
          #value: "Kailh MX Switch Sockets"
          #value: "HanElectricity CPG151101S11-16"
          # JLC Part
          value: "C41430893"
          hotswap_3dmodel_filename: "${SCOTTOKEEBS_KICAD}/3dmodels/ScottoKeebs_Hotswap.3dshapes/Hotswap_MX.step"
          hotswap_3dmodel_xyz_offset: [0, 0, -1.9]
          hotswap_3dmodel_xyz_rotation: [180, 0, 0]
        adjust:
          rotate: 180
      mx_col_via:
        what: ceoloide/utility_router
        where: meta.tags ~ /key/
        params:
          net: "{{column_net}}"
          route: "(7.0, 2.5)v"
      diode:
        what: travis/DSMD_1206_3216Metric
        where: meta.tags ~ /key/
        params:
          side: B
          from: "{{name}}"
          to: "{{row_net}}"
          # SOD-123 1N4148W
          # JLC Part
          value: "C7420318"
          refpos: [-1.5, 2.75, 0]
        adjust:
          #shift: [-(U / 2 - 1.1), -(U / 2 - 1.5 - 1.9)]
          shift: [-(U / 2 - 3.5), -(U / 2 - 1)]
          rotate: 90
      mx_diode_route:
        what: ceoloide/utility_router
        where: meta.tags ~ /key/
        params:
          width: 0.254
          net: "{{row_net}}"
          route: "b(-6.0, 5.1)(-6.0, 7.26)"

      # leds
      led_odd: &led
        what: travis/led_sk6812mini-e
        where: meta.tags ~ /row_odd/
        params:
          P1: "VCC"
          P2: "{{key.led_next}}" # DOUT: next P4
          P3: "GND"
          P4: "{{key.led_this}}" # DIN: previous P2 or pro micro data pin
          ref_override: "{{key.led_this}}"
          #value: "SK6812MINI-EA"
          # JLC Part:
          value: "C5378731"
          valpos: [0, 2.25]
          include_keepout: true
        adjust:
          shift: [0, 4.96]
          rotate: 180
      ledlabel_odd: &led_label
        what: ceoloide/utility_text
        where: meta.tags ~ /row_odd/
        params:
          text: "{{key.led_this}}"
          reversible: true
          height: 1.0
          width: 1.0
        adjust:
          shift:  [0, -(-4.96 - 2.4)]
      ledcap_odd: &led_cap # 104
        what: travis/CSMD_1206_3216Metric
        where: meta.tags ~ /row_odd/
        params:
          side: B
          # 104 100nF
          #value: "NM1206B104K251CEGN"
          # JLC Part
          value: "C710467"
          refpos: [-1.5, 2.75, 0]
          valpos: [-2.5, 0]
        adjust:
          shift: [-4.75, 4.25]
          rotate: 270
      led_cap_route_odd: &led_cap_route
        what: ceoloide/utility_router
        where: meta.tags ~ /row_odd/
        params:
          width: 0.3556
          net: "VCC"
          route: "b(-2.94, -5.7)(-4.75, -5.7)"

      led_even:
        <<: *led
        where: meta.tags ~ /row_even/
        adjust.rotate: 0
      ledlabel_even:
        <<: *led_label
        where: meta.tags ~ /row_even/
        adjust.rotate: 0
      ledcap_even:
        <<: *led_cap
        where: meta.tags ~ /row_even/
        adjust:
          shift: [4.75, 5.65]
          rotate: 90
      led_cap_route_even:
        <<: *led_cap_route
        where: meta.tags ~ /row_even/
        params.route: "b(2.94, -4.25)(4.75, -4.27)"

      # stabs
      left2u: &stab2u
        what: travis/ScottoKeebs-Stabilizer_MX_2u
        where:
          ref: matrix_col0_row0
          shift: [0, 0]
          rotate: 0
      right2u:
        <<: *stab2u
        where.ref: matrix_col6_row0

      # logos
      ergologo:
        what: ceoloide/utility_ergogen_logo
        where:
          ref: matrix_col2_row5
        params:
          scale: 2.0
        adjust:
          shift: [0, kp]
      travis:
        what: travis/travis
        where:
          ref: matrix_col4_row5
        params:
          scale: 3.0
        adjust:
          shift: [0, kp]
      roc:
        what: travis/roc
        where:
          ref: matrix_col0_row5
        params:
          side: "B"
          scale: 0.15
        adjust:
          shift: [0, kp]
      roclove:
        what: ceoloide/utility_text
        where:
          ref: matrix_col0_row5
        params:
          face: *cool_font
          text: "made with ♥ in #ROC"
          mirrored: true
          side: "B"
          height: 1.1
          width: 1.1
        adjust:
          shift: [0, kp/2]
      name:
        what: ceoloide/utility_text
        where:
          ref: matrix_col3_row5
        params:
          face: *cool_font
          text: *name
          height: 2.5
          width: 2.5
          #align: "center"
          bold: true
        adjust:
          shift: [0, kp]
      url:
        what: ceoloide/utility_text
        where:
          ref: matrix_col3_row5
        params:
          text: *url
          #align: "right"
          side: B
          mirrored: true
        adjust:
          shift: [0, kp]
      version:
        what: ceoloide/utility_text
        where:
          ref: matrix_col3_row5
        params:
          face: *cool_font
          text: *meta_version
          height: 1.0
          width: 1.0
          #align: "center"
        adjust:
          shift: [0, kp - 2]
      pcbnumber:
        what: ceoloide/utility_text
        where:
          ref: matrix_col3_row0
        adjust:
          shift: [0, -kp/2 - 1]
        params:
          text: JLCJLCJLCJLC
          #text: WayWayWay
          reversible: true

      # holes:
      holeTopLeft:
        what: travis/mountinghole
        where:
          <<: *holeTopLeft
        params:
          pad: 1
      holeTopCenter:
        what: travis/mountinghole
        where:
          <<: *holeTopCenter
        params:
          pad: 2
      holeTopRight:
        what: travis/mountinghole
        where:
          <<: *holeTopRight
        params:
          pad: 3
      holeBottomRight:
        what: travis/mountinghole
        where:
          <<: *holeBottomRight
        params:
          pad: 4
      holeBottomCenter:
        what: travis/mountinghole
        where:
          <<: *holeBottomCenter
        params:
          pad: 5
      holeBottomLeft:
        what: travis/mountinghole
        where:
          <<: *holeBottomLeft
        params:
          pad: 6

      # grounds
      background:
        what: ceoloide/utility_filled_zone
        params:
          side: "B"
          name: "back ground"
          connect_pads: "yes"
          points: [[15, 45], [205, 45], [205, 230], [15, 230]]
      foreground:
        what: ceoloide/utility_filled_zone
        params:
          side: "F"
          name: "fore ground"
          connect_pads: "yes"
          fill_type: "hatch"
          hatch_orientation: 45
          points: [[20, 50], [210, 50], [210, 235], [20, 235]]

cases:
  bottom:
    - name: board
      extrude: 1
  xlbottom:
    - name: xlboard
      extrude: 1
  _outerwall:
    - name: xlboard
      extrude: height + board
  _innerwall:
    - name: board
      extrude: height + board
  _holes:
    - name: mounting
      extrude: height
  _standoffs:
    - name: standoff
      extrude: height
  wall:
    - what: case
      name: _outerwall
      operation: add
    - what: case
      name: _innerwall
      operation: subtract
  case:
    - what: case
      name: _standoffs
      operation: add
    - what: case
      name: _holes
      operation: subtract
    - what: case
      name: xlbottom
      operation: add
    - what: case
      name: wall
      operation: add
  plate:
    - name: plate
      extrude: 1.41